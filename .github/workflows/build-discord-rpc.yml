name: Build MyStremio (Discord Rich Presence)

# Produces `mystremio-shell.exe` with the ported Discord Rich Presence.
#
# The exe is a DROP-IN replacement: copy it over the one in your existing
# MyStremio install folder (default: C:\Program Files\MyStremio\). Nothing else
# -- webui, server, ffmpeg, your settings -- is touched.
#
# Triggers: pushing to main / discord-rpc-ng, or the "Run workflow" button
# under the Actions tab.

on:
  workflow_dispatch:
  push:
    branches: [main, discord-rpc-ng]
    paths:
      - "stremio-shell/stremio-shell-ng-main/**"
      - ".github/workflows/build-discord-rpc.yml"

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # The job that matters. Deliberately has NO `needs:` so that a pre-existing
  # lint/format issue elsewhere in the repo can never stop you getting the exe.
  # ---------------------------------------------------------------------------
  build:
    name: Build mystremio-shell.exe
    runs-on: windows-latest
    defaults:
      run:
        working-directory: stremio-shell/stremio-shell-ng-main
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc
          # This action defaults RUSTFLAGS to "-D warnings", which turns any
          # warning anywhere in the crate into a hard build failure. Clear it so
          # a stray warning can never cost you the artifact.
          rustflags: ""
          cache-workspaces: stremio-shell/stremio-shell-ng-main

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Fetch libmpv
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # build.rs refuses to link without libmpv-2.dll in the crate root.
          # Primary source is the shinchiro mirror on GitHub Releases -- these are
          # the same builds SourceForge hosts, but GitHub->GitHub avoids the
          # throttling/blocking SourceForge applies to CI datacenter IPs.
          $ErrorActionPreference = "Continue"
          $dll = "libmpv-2.dll"
          $archive = "mpv-dev.7z"

          function Try-Download($url) {
            Write-Host "  GET $url"
            if (Test-Path $archive) { Remove-Item $archive -Force }
            curl.exe --fail --location --silent --show-error --retry 3 --retry-delay 5 `
                     --output $archive $url
            if (-not (Test-Path $archive)) { Write-Host "  no file produced"; return $false }
            $size = (Get-Item $archive).Length
            Write-Host "  downloaded $size bytes"
            # An HTML error page would be far smaller than a ~30 MB archive.
            if ($size -lt 1000000) {
              Write-Host "  too small to be the archive; first bytes:"
              Get-Content $archive -TotalCount 3 | Write-Host
              return $false
            }
            & 7z e $archive "-o." $dll -y | Out-Null
            if (-not (Test-Path $dll)) { Write-Host "  $dll not present in archive"; return $false }
            return $true
          }

          $ok = $false

          # --- Source 1: shinchiro mirror on GitHub Releases ---
          Write-Host "Source 1: GitHub Releases (shinchiro/mpv-winbuild-cmake)"
          try {
            $headers = @{
              "Accept"        = "application/vnd.github+json"
              "Authorization" = "Bearer $env:GH_TOKEN"
              "User-Agent"    = "mystremio-ci"
            }
            $releases = Invoke-RestMethod -Headers $headers -Uri `
              "https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases?per_page=10"
            # '-\d' skips the "-v3-" (AVX2) variant so the build still runs on older CPUs.
            $asset = $releases.assets |
                     Where-Object { $_.name -match '^mpv-dev-x86_64-\d' } |
                     Select-Object -First 1
            if ($asset) {
              Write-Host "  found $($asset.name)"
              $ok = Try-Download $asset.browser_download_url
            } else {
              Write-Host "  no matching asset in the latest 10 releases"
            }
          } catch {
            Write-Host "  failed: $($_.Exception.Message)"
          }

          # --- Source 2: SourceForge (original upstream location) ---
          if (-not $ok) {
            Write-Host "Source 2: SourceForge"
            try {
              $rss = Invoke-WebRequest -UseBasicParsing -TimeoutSec 60 -Uri `
                "https://sourceforge.net/projects/mpv-player-windows/rss?path=/libmpv"
              $m = [regex]::Matches($rss.Content,
                    '<link>(?<u>[^<]*mpv-dev-x86_64-\d[^<]*\.7z/download)</link>') |
                   Select-Object -First 1
              if ($m) {
                $ok = Try-Download $m.Groups['u'].Value
              } else {
                Write-Host "  no download link found in RSS feed"
              }
            } catch {
              Write-Host "  failed: $($_.Exception.Message)"
            }
          }

          if (-not $ok) { throw "Could not obtain libmpv-2.dll from any source" }

          # Sanity check: a real DLL starts with the 'MZ' PE signature.
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $dll))
          $sig = [System.Text.Encoding]::ASCII.GetString($bytes[0..1])
          Write-Host "libmpv-2.dll: $($bytes.Length) bytes, signature '$sig'"
          if ($sig -ne "MZ") { throw "libmpv-2.dll is not a valid Windows DLL" }
          Write-Host "libmpv ready."

      - name: Build release
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target\x86_64-pc-windows-msvc\release\mystremio-shell.exe" dist
          # Bundled in case your install's copy predates this libmpv build.
          Copy-Item "libmpv-2.dll" dist
          Copy-Item "RPCconfig.example.ini" dist -ErrorAction SilentlyContinue
          Get-ChildItem dist | Format-Table Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mystremio-shell-discord-rpc
          path: stremio-shell/stremio-shell-ng-main/dist/**
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Advisory only. MyStremio's existing source is not rustfmt-clean (14 of 31
  # files), so a repo-wide gate would be permanently red through no fault of
  # this port. Nothing here can fail the run.
  # ---------------------------------------------------------------------------
  quality:
    name: Checks (advisory)
    runs-on: windows-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: stremio-shell/stremio-shell-ng-main
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc
          components: rustfmt, clippy
          rustflags: ""
          cache-workspaces: stremio-shell/stremio-shell-ng-main

      - name: Format check (ported files only)
        continue-on-error: true
        run: |
          rustfmt --edition 2018 --check src/stremio_app/discord_presence.rs
          rustfmt --edition 2018 --check src/stremio_app/stremio_player/player.rs
