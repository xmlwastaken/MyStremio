; MyStremio - Discord Rich Presence configuration
;
; Copy this file next to mystremio-shell.exe and rename it to RPCconfig.ini.
; If it is missing, MyStremio creates one with these defaults on first run.
; Changes are picked up on the next refresh - no restart needed.
;
; Note: the three toggles on the MyStremio Settings page still apply on top of
; this file. "Show while paused" OFF behaves like disable_when_paused=true, and
; "Show in menus" OFF behaves like disable_in_menu=true.

[Discord]
; Discord application whose name/assets are shown. Leave as-is unless you have
; registered your own app in the Discord Developer Portal.
app_id=997798118185771059

[Buttons]
; Show the two clickable buttons under the presence.
show_buttons=true
; Where the "Open in Stremio" button points:
;   app -> stremio:///detail/...        (opens your local MyStremio)
;   web -> https://web.stremio.com/...  (opens Stremio in a browser)
link_target=app

[Activity]
; Hide the presence entirely while browsing menus (Board, Library, Settings...).
disable_in_menu=false
; Hide the presence while playback is paused.
disable_when_paused=false
; Seconds between presence refreshes. Range 1-60. Discord rate-limits updates
; to roughly one every 15s, so very low values gain little.
refresh_interval=5
; Show the small circular play/pause badge over the poster.
show_small_image=true
; Swap which line is the big title and which is the subtitle.
swap_name_and_title=false

[Lobby]
; Maximum party size advertised for watch parties. Range 2-32.
lobby_max_size=8
